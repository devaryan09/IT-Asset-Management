<!DOCTYPE html>

<head>

<title>IT Asset Management - Label UP</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#0f1117;color:#e2e8f0;min-height:100vh;font-size:14px}
:root{--bg:#0f1117;--surface:#1a1d27;--surface2:#232636;--border:#2e3348;--accent:#4f8ef7;--success:#10b981;--warn:#f59e0b;--danger:#ef4444;--text:#e2e8f0;--muted:#8892a4;--card:#1e2130}
.app{display:flex;height:100vh;overflow:hidden}
.sidebar{width:220px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0}
.logo{padding:16px;border-bottom:1px solid var(--border)}
.logo-company{font-size:11px;font-weight:700;color:#a78bfa;letter-spacing:1px;margin-bottom:8px}
.logo-icon{width:32px;height:32px;background:linear-gradient(135deg,#4f8ef7,#7c3aed);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px;margin-bottom:6px}
.logo h1{font-size:13px;font-weight:700;color:#fff}
.logo p{font-size:11px;color:var(--muted)}
.nav{flex:1;padding:12px 8px;overflow-y:auto}
.nav-section{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:1px;padding:8px 8px 4px}
.nav-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;cursor:pointer;color:var(--muted);font-size:13px;margin-bottom:2px;transition:all .15s}
.nav-item:hover{background:var(--surface2);color:var(--text)}
.nav-item.active{background:rgba(79,142,247,.15);color:var(--accent)}
.role-badge{margin:8px;padding:10px;background:rgba(124,58,237,.1);border:1px solid rgba(124,58,237,.3);border-radius:8px;font-size:11px;color:#a78bfa;cursor:pointer}
.main{flex:1;overflow:hidden;display:flex;flex-direction:column}
.topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:8px 16px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.topbar h2{font-size:15px;font-weight:600;color:#fff;flex:1;white-space:nowrap;margin:0}
.btn{padding:5px 10px;border-radius:7px;border:none;cursor:pointer;font-size:11px;font-weight:500;transition:all .15s;display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:#3b7de8}
.btn-secondary{background:var(--surface2);color:var(--text);border:1px solid var(--border)}
.btn-secondary:hover{background:var(--border)}
.btn-danger{background:rgba(239,68,68,.15);color:var(--danger);border:1px solid rgba(239,68,68,.3)}
.btn-success{background:rgba(16,185,129,.15);color:var(--success);border:1px solid rgba(16,185,129,.3)}
.btn-warn{background:rgba(245,158,11,.15);color:var(--warn);border:1px solid rgba(245,158,11,.3)}
.btn-excel{background:rgba(16,185,129,.2);color:#34d399;border:1px solid rgba(16,185,129,.4);font-weight:700}
.content{flex:1;overflow-y:auto;overflow-x:hidden;padding:20px}
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px}
.stat-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.stat-value{font-size:26px;font-weight:700;color:#fff}

.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.section-title{font-size:14px;font-weight:600;color:#fff}
.table-wrap{background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:16px}
table{width:100%;border-collapse:collapse}
th{padding:9px 14px;text-align:left;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;background:var(--surface2);border-bottom:1px solid var(--border)}
td{padding:10px 14px;font-size:13px;color:var(--text);border-bottom:1px solid rgba(46,51,72,.5)}
tr:last-child td{border-bottom:none}

.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:500}
.badge-success{background:rgba(16,185,129,.15);color:#34d399}

.badge-blue{background:rgba(79,142,247,.15);color:#7db4fa}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:14px;width:100%;max-width:500px;max-height:90vh;overflow-y:auto}
.modal-header{padding:18px 20px 0;display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.modal-header h3{font-size:15px;font-weight:600;color:#fff}
.modal-close{width:26px;height:26px;border-radius:6px;background:var(--surface2);border:1px solid var(--border);cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:15px}
.modal-body{padding:0 20px}
.modal-footer{padding:16px 20px;display:flex;gap:8px;justify-content:flex-end;border-top:1px solid var(--border);margin-top:16px}
.form-group{margin-bottom:14px}
.form-label{font-size:12px;font-weight:500;color:var(--muted);margin-bottom:5px;display:block}
.form-input,.form-select{width:100%;padding:8px 11px;background:var(--surface2);border:1px solid var(--border);border-radius:7px;color:var(--text);font-size:13px;outline:none}
.form-input:focus,.form-select:focus{border-color:var(--accent)}
.form-select option{background:var(--surface)}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.search-bar{position:relative;flex:1;max-width:260px}
.search-bar input{width:100%;padding:6px 10px 6px 30px;background:var(--surface2);border:1px solid var(--border);border-radius:7px;color:var(--text);font-size:12px;outline:none}
.search-bar input:focus{border-color:var(--accent)}
.search-icon{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:12px}
.filter-bar{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap;align-items:center}
.filter-chip{padding:3px 9px;border-radius:99px;font-size:11px;cursor:pointer;border:1px solid var(--border);background:var(--surface2);color:var(--muted);transition:all .15s}
.filter-chip.active{background:rgba(79,142,247,.2);color:var(--accent);border-color:rgba(79,142,247,.4)}
.empty-state{text-align:center;padding:40px 20px;color:var(--muted)}
.empty-icon{font-size:32px;margin-bottom:10px;opacity:.5}
.dash-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:20px}
.type-breakdown{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px}
.type-row{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.type-bar-bg{flex:1;height:5px;background:var(--surface2);border-radius:99px;overflow:hidden}
.type-bar{height:100%;border-radius:99px;background:var(--accent)}
.type-label{font-size:12px;color:var(--text);min-width:90px}
.type-count{font-size:12px;color:var(--muted);min-width:20px;text-align:right}
.history-list{list-style:none}
.history-item{padding:8px 0;border-bottom:1px solid rgba(46,51,72,.5);display:flex;gap:10px;align-items:flex-start}
.history-item:last-child{border-bottom:none}
.history-dot{width:7px;height:7px;border-radius:50%;background:var(--accent);margin-top:5px;flex-shrink:0}
.history-dot.unassign{background:var(--muted)}
.history-info strong{font-size:13px;color:#fff;display:block}
.history-info small{font-size:11px;color:var(--muted)}
.avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#4f8ef7,#7c3aed);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;flex-shrink:0}
.avatar-sm{width:24px;height:24px;font-size:10px}
.chip{display:inline-flex;align-items:center;padding:2px 8px;border-radius:99px;font-size:11px;background:var(--surface2);border:1px solid var(--border);color:var(--muted)}
.detail-section{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:14px}
.detail-section h4{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px}
.assign-user-card{background:var(--surface2);border:1px solid var(--border);border-radius:7px;padding:9px 11px;display:flex;align-items:center;gap:9px;margin-bottom:6px;cursor:pointer;transition:all .15s}
.assign-user-card:hover,.assign-user-card.selected{border-color:var(--accent);background:rgba(79,142,247,.1)}
.notification{position:fixed;bottom:16px;right:16px;background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:10px 14px;display:flex;align-items:center;gap:8px;font-size:12px;z-index:200;animation:slideIn .2s ease;max-width:280px}
.notification.success{border-color:rgba(16,185,129,.4);background:rgba(16,185,129,.08)}
.notification.error{border-color:rgba(239,68,68,.4);background:rgba(239,68,68,.08)}
@keyframes slideIn{from{transform:translateY(16px);opacity:0}to{transform:translateY(0);opacity:1}}
.login-screen{min-height:100vh;background:#0f1117;display:flex;align-items:center;justify-content:center}
.login-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:36px;width:100%;max-width:360px}
.login-logo{display:flex;align-items:center;gap:12px;margin-bottom:24px}
.login-logo-icon{width:40px;height:40px;background:linear-gradient(135deg,#4f8ef7,#7c3aed);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px}
.login-company{font-size:10px;font-weight:700;color:#a78bfa;letter-spacing:1px}
.login-title{font-size:20px;font-weight:700;color:#fff;margin-bottom:4px}
.login-sub{font-size:12px;color:var(--muted);margin-bottom:24px}
.login-error{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);border-radius:7px;padding:9px 12px;font-size:12px;color:#f87171;margin-bottom:14px}
.show-hide{position:absolute;right:10px;top:32px;cursor:pointer;color:var(--muted);font-size:12px;user-select:none}
.confirm-overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center;z-index:300}
.confirm-box{background:#1e2130;border:1px solid #2e3348;border-radius:16px;padding:32px 28px;max-width:340px;width:90%;text-align:center;animation:slideIn .2s ease}
.confirm-box p{font-size:16px;font-weight:500;color:#e2e8f0;margin-bottom:24px;line-height:1.5}
.confirm-btns{display:flex;gap:12px;justify-content:center}
.btn-yes{background:#ef4444;color:#fff;border:none;padding:11px 30px;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;transition:all .15s}
.btn-yes:hover{background:#dc2626;transform:scale(1.03)}
.btn-no{background:#22c55e;color:#fff;border:none;padding:11px 30px;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;transition:all .15s}
.btn-no:hover{background:#16a34a;transform:scale(1.03)}
</style>

<body>
<div id="root"></div>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
const {useState,useEffect,useMemo,useRef}=React;

// ---- CONSTANTS ----
const DEFAULT_TYPES=['Laptop','Monitor','Mouse','Keyboard','Headset','Webcam','Docking Station','Printer','Other'];
const DEPARTMENTS=['Engineering','Finance','HR','Marketing','Operations','Sales','IT','Design','Kovark'];
const DB_KEY='itam_v3';
const ADMIN_PASS='navraj@123';

// ---- FIREBASE ----
const firebaseConfig = {
  apiKey: "AIzaSyAIAKblDWrOptCkga7yHOqBd_DpbBo6x1w",
  authDomain: "label-up-itam.firebaseapp.com",
  projectId: "label-up-itam",
  storageBucket: "label-up-itam.firebasestorage.app",
  messagingSenderId: "276923281427",
  appId: "1:276923281427:web:5befd4beeb850824400fe6"
};
let DOC_REF = null;
try {
  if(typeof firebase !== 'undefined'){
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    DOC_REF = db.collection('itam').doc('data');
  }
} catch(e){ console.warn('Firebase unavailable'); }

async function fbSave(assets, employees, history, types) {
  if(!DOC_REF) return false;
  try {
    await DOC_REF.set({ assets, employees, history, types, savedAt: new Date().toISOString() });
    return true;
  } catch(e) { console.error('FB save failed', e); return false; }
}
async function fbLoad() {
  if(!DOC_REF) return null;
  try {
    const snap = await DOC_REF.get();
    if (snap.exists) return snap.data();
    return null;
  } catch(e) { console.error('FB load failed', e); return null; }
}
// ---- END FIREBASE ----

// ---- BACKUP SYSTEM ----
function getStorageStats(assets, employees, history, types) {
  const data = {assets, employees, history, types, savedAt: new Date().toISOString()};
  const bytes = new TextEncoder().encode(JSON.stringify(data)).length;
  const kb = bytes / 1024;
  const mb = kb / 1024;
  const LIMIT_GB = 1;
  const LIMIT_BYTES = LIMIT_GB * 1024 * 1024 * 1024;
  const pct = (bytes / LIMIT_BYTES) * 100;
  const remainMB = (LIMIT_BYTES - bytes) / (1024 * 1024);
  return {bytes, kb, mb, pct, remainMB, assets: assets.length, employees: employees.length, history: history.length};
}

function downloadBackup(assets, employees, history, types, label) {
  const now = new Date();
  const stamp = now.toISOString().slice(0,19).replace(/[T:]/g,'-');
  const data = {
    _backup: {createdAt: now.toISOString(), label: label||'manual', version: '2.0',
               assets: assets.length, employees: employees.length, history: history.length},
    assets, employees, history, types
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `ITAM_Backup_${stamp}.json`;
  document.body.appendChild(a); a.click();
  document.body.removeChild(a); URL.revokeObjectURL(url);
}

function getBackupHistory() {
  try { return JSON.parse(localStorage.getItem('itam_backup_log')||'[]'); } catch(e){ return []; }
}
function logBackup(label, stats) {
  const logs = getBackupHistory().slice(-49); // keep last 50
  logs.push({date: new Date().toISOString(), label, ...stats});
  try { localStorage.setItem('itam_backup_log', JSON.stringify(logs)); } catch(e){}
}
function getScheduledBackup() {
  try { return JSON.parse(localStorage.getItem('itam_backup_schedule')||'null'); } catch(e){ return null; }
}
function setScheduledBackup(config) {
  try { localStorage.setItem('itam_backup_schedule', JSON.stringify(config)); } catch(e){}
}
function getDaysUntilNextBackup() {
  const sch = getScheduledBackup();
  if(!sch || !sch.enabled || !sch.lastBackup) return null;
  const freqDays = sch.frequency==='daily'?1:sch.frequency==='weekly'?7:30;
  const diffMs = new Date() - new Date(sch.lastBackup);
  const diffDays = diffMs / (1000*60*60*24);
  const remaining = freqDays - diffDays;
  return remaining < 0 ? 0 : remaining;
}
function isBackupDue() {
  const sch = getScheduledBackup();
  if(!sch || !sch.enabled) return false;
  const last = sch.lastBackup ? new Date(sch.lastBackup) : null;
  if(!last) return true;
  const diffDays = (new Date() - last) / (1000*60*60*24);
  if(sch.frequency === 'daily' && diffDays >= 1) return true;
  if(sch.frequency === 'weekly' && diffDays >= 7) return true;
  if(sch.frequency === 'monthly' && diffDays >= 30) return true;
  return false;
}
function checkScheduledBackup(assets, employees, history, types) {
  const sch = getScheduledBackup();
  if(!sch || !sch.enabled) return false;
  if(!isBackupDue()) return false;
  downloadBackup(assets, employees, history, types, 'auto-'+sch.frequency);
  const stats = getStorageStats(assets,employees,history,types);
  logBackup('auto-'+sch.frequency, stats);
  sch.lastBackup = new Date().toISOString();
  setScheduledBackup(sch);
  return true;
}
// ---- END BACKUP SYSTEM ----


// ---- HELPERS ----
function genId(p){return p+'-'+Math.random().toString(36).substr(2,6).toUpperCase();}
function today(){return new Date().toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'});}
function initials(n){return (n||'?').split(' ').map(w=>w[0]).join('').substring(0,2).toUpperCase();}
function loadDB(){
  try{
    const r=localStorage.getItem(DB_KEY);
    if(r){const d=JSON.parse(r);if(d&&d.assets&&d.employees&&d.assets.length>=100)return d;}
    const b=localStorage.getItem(DB_KEY+'_bak');
    if(b){const d=JSON.parse(b);if(d&&d.assets&&d.assets.length>=100)return d;}
  }catch(e){}
  return null;
}
function saveDB(a,e,h,t){
  try{
    const d={assets:a,employees:e,history:h,types:t,at:new Date().toISOString()};
    const s=JSON.stringify(d);
    localStorage.setItem(DB_KEY,s);
    localStorage.setItem(DB_KEY+'_bak',s);
    return true;
  }catch(e){return false;}
}
function exportJSON(a,e,h,t){
  const d={assets:a,employees:e,history:h,types:t,at:new Date().toISOString()};
  const blob=new Blob([JSON.stringify(d,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const el=document.createElement('a');
  el.href=url;el.download='ITAM_Backup_'+new Date().toISOString().slice(0,10)+'.json';
  document.body.appendChild(el);el.click();document.body.removeChild(el);URL.revokeObjectURL(url);
}
function exportExcel(assets,employees,history){
  function getEmp(id){return employees.find(e=>e.id===id)||{};}
  function fmtDate(d){if(!d||d==='—'||d==='N/A')return '';return d;}
  function s(v){return String(v||'');}

  // Helper: build sheet with header row + data rows
  function makeSheet(headers, rows){
    const ws = XLSX.utils.aoa_to_sheet([headers, ...rows]);
    // Style header row - bold + dark blue bg
    const range = XLSX.utils.decode_range(ws['!ref']||'A1');
    for(let C = range.s.c; C <= range.e.c; C++){
      const cellAddr = XLSX.utils.encode_cell({r:0, c:C});
      if(!ws[cellAddr]) continue;
      ws[cellAddr].s = {
        font: {bold:true, color:{rgb:'FFFFFF'}, sz:11},
        fill: {fgColor:{rgb:'1F3864'}, patternType:'solid'},
        alignment: {horizontal:'center', vertical:'center', wrapText:true},
        border: {bottom:{style:'thin',color:{rgb:'4472C4'}}}
      };
    }
    // Auto column widths
    ws['!cols'] = headers.map((h,i)=>{
      const maxData = rows.reduce((m,r)=>Math.max(m, s(r[i]).length), 0);
      return {wch: Math.min(Math.max(h.length, maxData) + 2, 50)};
    });
    // Freeze header row
    ws['!freeze'] = {xSplit:0, ySplit:1};
    return ws;
  }

  const wb = XLSX.utils.book_new();

  // ── LAPTOP ──────────────────────────────────────────────────────────────────
  const lapH=['EMPLOYEE-ID','EMPLOYEE NAME','DEPARTMENT','ITEM NAME','DESCRIPTION','SERIAL NUM (SN#)','RAM','ROM','QUANTITY ISSUE','DATE ISSUED','CONDITION','RETURN DATE','COMMENTS'];
  const lapR=assets.filter(a=>a.type==='Laptop').map(a=>{
    const e=getEmp(a.assignedTo);
    return [s(e.id),s(e.name),s(e.department),s(a.brand),s(a.description),s(a.serial),s(a.ram),s(a.rom),'1',fmtDate(a.assignDate||a.purchaseDate),s(a.condition||'New'),'',s(a.comments||'')];
  });
  XLSX.utils.book_append_sheet(wb, makeSheet(lapH,lapR), 'LAPTOP');

  // ── MONITOR ─────────────────────────────────────────────────────────────────
  const monH=['EMPLOYEE-ID','EMPLOYEE NAME','DEPARTMENT','ITEM NAME','QUANTITY ISSUED','DATE ISSUED','CONDITION','COMMENTS'];
  const monR=assets.filter(a=>a.type==='Monitor').map(a=>{
    const e=getEmp(a.assignedTo);
    return [s(e.id),s(e.name),s(e.department),s(a.brand),'1',fmtDate(a.assignDate||a.purchaseDate),s(a.condition||'New'),s(a.description||'')];
  });
  XLSX.utils.book_append_sheet(wb, makeSheet(monH,monR), 'MONITOR');

  // ── KEYBOARD-MOUSE ──────────────────────────────────────────────────────────
  const kmH=['EMPLOYEE-ID','EMPLOYEE NAME','DEPARTMENT','KEYBOARD','MOUSE','ACCESSORY BRAND/MODEL','SERIAL NUMBER (KEYBOARD)','SERIAL NUMBER (MOUSE)','CONDITION','COMMENT'];
  const kbMap={},msMap={};
  assets.filter(a=>a.type==='Keyboard').forEach(a=>{if(a.assignedTo)kbMap[a.assignedTo]=a;});
  assets.filter(a=>a.type==='Mouse').forEach(a=>{if(a.assignedTo)msMap[a.assignedTo]=a;});
  const kmIds=[...new Set([...Object.keys(kbMap),...Object.keys(msMap)])];
  const kmR=kmIds.map(id=>{
    const e=getEmp(id);const kb=kbMap[id];const ms=msMap[id];
    return [s(e.id),s(e.name),s(e.department),kb?'1':'',ms?'1':'',s((kb||ms)?.brand||''),s(kb?.serial||''),s(ms?.serial||''),s(kb?.condition||ms?.condition||'New'),s(kb?.comments||ms?.comments||'')];
  });
  XLSX.utils.book_append_sheet(wb, makeSheet(kmH,kmR), 'KEYBOARD- MOUSE');

  // ── HEADPHONES ──────────────────────────────────────────────────────────────
  const hpH=["EMPLOYEE-ID","EMPLOYEE NAME","HEADPHONE BRAND/MODEL","QUANTITY ISSUED","COMMENTS"];
  const hpR=assets.filter(a=>a.type==='Headset'||a.type==='Headphone').map(a=>{
    const e=getEmp(a.assignedTo);
    return [s(e.id),s(e.name),s(a.brand+(a.model&&a.model!=='H111'?' '+a.model:'')),'1',s(a.comments||'')];
  });
  XLSX.utils.book_append_sheet(wb, makeSheet(hpH,hpR), "HEADPHONE'S");

  // ── LAPTOP STAND ────────────────────────────────────────────────────────────
  const stH=['EMPLOYEE-ID','EMPLOYEE NAME','STAND BRAND/MODEL','QUANTITY ISSUED','COMMENTS'];
  const stR=assets.filter(a=>a.type==='Laptop Stand'||a.type==='Stand').map(a=>{
    const e=getEmp(a.assignedTo);
    return [s(e.id),s(e.name),s(a.brand+(a.model?' '+a.model:'')),'1',s(a.comments||'')];
  });
  XLSX.utils.book_append_sheet(wb, makeSheet(stH,stR), 'LAPTOP STAND');

  // ── OTHER-ACCS ──────────────────────────────────────────────────────────────
  const knownTypes=new Set(['Laptop','Monitor','Keyboard','Mouse','Headset','Headphone','Laptop Stand','Stand']);
  const otherR=assets.filter(a=>!knownTypes.has(a.type)).map(a=>{
    const e=getEmp(a.assignedTo);
    return [s(e.id),s(e.name),s(e.department),s(a.type),s(a.brand+(a.model?' '+a.model:'')),s(a.serial),s(a.condition),fmtDate(a.assignDate||a.purchaseDate),s(a.description||'')];
  });
  if(otherR.length){
    const otherH=['EMPLOYEE-ID','EMPLOYEE NAME','DEPARTMENT','ITEM TYPE','ITEM NAME','SERIAL','CONDITION','DATE ISSUED','COMMENTS'];
    XLSX.utils.book_append_sheet(wb, makeSheet(otherH,otherR), 'OTHER-ACCS');
  }

  // ── DOWNLOAD as real .xlsx ───────────────────────────────────────────────────
  const fname='Office_Inventory_'+new Date().toISOString().slice(0,10)+'.xlsx';
  XLSX.writeFile(wb, fname, {bookType:'xlsx', type:'binary', cellStyles:true});
}
function importJSON(file,onOk,onErr){
  const r=new FileReader();
  r.onload=e=>{try{const d=JSON.parse(e.target.result);if(!d.assets||!d.employees)throw new Error('bad');onOk(d);}catch(ex){onErr('Invalid backup file.');}};
  r.readAsText(file);
}

// ---- LOGIN ----
const LOGIN_USER='labelupitam';
const LOGIN_PASS='oneteamify@123';
function Login({onLogin}){
  const [u,setU]=useState('');
  const [p,setP]=useState('');
  const [show,setShow]=useState(false);
  const [err,setErr]=useState('');
  const [attempts,setAttempts]=useState(0);
  const [locked,setLocked]=useState(false);
  const [countdown,setCountdown]=useState(0);

  useEffect(()=>{
    // Force clear fields on mount
    setU('');setP('');
    // Check if locked out
    try{
      const lockData=JSON.parse(localStorage.getItem('itam_lock')||'{}');
      if(lockData.until&&Date.now()<lockData.until){
        setLocked(true);
        const remaining=Math.ceil((lockData.until-Date.now())/1000);
        setCountdown(remaining);
      }
    }catch(e){}
  },[]);

  useEffect(()=>{
    if(countdown>0){
      const t=setTimeout(()=>{
        setCountdown(c=>c-1);
        if(countdown===1){setLocked(false);setAttempts(0);localStorage.removeItem('itam_lock');}
      },1000);
      return()=>clearTimeout(t);
    }
  },[countdown]);

  function attempt(){
    if(locked)return;
    if(u.trim()===LOGIN_USER&&p===LOGIN_PASS){
      setAttempts(0);localStorage.removeItem('itam_lock');
      onLogin('admin');
    }else{
      const newAttempts=attempts+1;
      setAttempts(newAttempts);
      if(newAttempts>=3){
        // Lock for 30 seconds
        const until=Date.now()+30000;
        try{localStorage.setItem('itam_lock',JSON.stringify({until}));}catch(e){}
        setLocked(true);setCountdown(30);
        setErr('Too many failed attempts. Locked for 30 seconds.');
      }else{
        setErr('Invalid username or password. ('+(3-newAttempts)+' attempts remaining)');
      }
    }
  }

  return React.createElement('div',{className:'login-screen'},
    React.createElement('div',{className:'login-card'},
      React.createElement('div',{className:'login-logo'},
        React.createElement('div',{className:'login-logo-icon'},'⬡'),
        React.createElement('div',null,
          React.createElement('div',{className:'login-company'},'Label UP'),
          React.createElement('div',{style:{fontWeight:700,color:'#fff',fontSize:16}},'ITAM'),
          React.createElement('div',{style:{fontSize:11,color:'var(--muted)'}},'Asset Management')
        )
      ),
      React.createElement('div',{className:'login-title'},'Welcome back'),
      React.createElement('div',{className:'login-sub'},'Sign in to access the system'),
      err&&React.createElement('div',{className:'login-error'},err),
      React.createElement('input',{type:'text',style:{display:'none'},name:'fakeusername',autoComplete:'username'}),
      React.createElement('input',{type:'password',style:{display:'none'},name:'fakepassword',autoComplete:'current-password'}),
      locked&&React.createElement('div',{style:{background:'rgba(239,68,68,.1)',border:'1px solid rgba(239,68,68,.3)',borderRadius:7,padding:'10px 12px',fontSize:12,color:'#f87171',marginBottom:14,textAlign:'center'}},
        '🔒 Account locked. Try again in ',React.createElement('strong',null,countdown),' seconds.'
      ),
      React.createElement('div',{className:'form-group'},
        React.createElement('label',{className:'form-label'},'Username'),
        React.createElement('input',{className:'form-input',value:u,placeholder:'Enter username',onChange:e=>setU(e.target.value),onKeyDown:e=>e.key==='Enter'&&attempt(),disabled:locked,autoComplete:'off',name:'itam_u_'+Math.random().toString(36).substr(2,9),id:'itam_u_'+Math.random().toString(36).substr(2,9)})
      ),
      React.createElement('div',{className:'form-group',style:{position:'relative'}},
        React.createElement('label',{className:'form-label'},'Password'),
        React.createElement('input',{className:'form-input',type:show?'text':'password',value:p,placeholder:'Enter password',onChange:e=>setP(e.target.value),onKeyDown:e=>e.key==='Enter'&&attempt(),style:{paddingRight:50},disabled:locked,autoComplete:'off',name:'itam_p_'+Math.random().toString(36).substr(2,9),id:'itam_p_'+Math.random().toString(36).substr(2,9)}),
        React.createElement('span',{className:'show-hide',onClick:()=>setShow(s=>!s)},show?'Hide':'Show')
      ),
      React.createElement('button',{className:'btn btn-primary',style:{width:'100%',justifyContent:'center',padding:'9px',opacity:locked?.5:1},onClick:attempt,disabled:locked},
        locked?'🔒 Locked ('+countdown+'s)':'Sign In'
      )
    )
  );
}

// ---- ROOT ----
function Root(){
  const [loggedIn,setLoggedIn]=useState(()=>{
    try{return sessionStorage.getItem('itam_session')==='1';}catch(e){return false;}
  });
  function login(){
    try{sessionStorage.setItem('itam_session','1');}catch(e){}
    setLoggedIn(true);
  }
  function logout(){
    try{sessionStorage.removeItem('itam_session');}catch(e){}
    setLoggedIn(false);
  }
  if(!loggedIn)return React.createElement(Login,{onLogin:login});
  return React.createElement(App,{onLogout:logout});
}

  const db=useMemo(()=>loadDB(),[]);
  const [assets,setAssets]=useState(()=>db?db.assets:INIT_ASSETS);

  const [history,setHistory]=useState(()=>db?db.history:INIT_HISTORY);

  const [modal,setModal]=useState(null);
  const [notif,setNotif]=useState(null);

  const [pinModal,setPinModal]=useState(false);
  const [pinVal,setPinVal]=useState('');
  const [pinErr,setPinErr]=useState('');
  const [saved,setSaved]=useState(!!db);
  const [confirm,setConfirm]=useState(null); // {message, onYes}
  function askConfirm(message,onYes){setConfirm({message,onYes});}
  function closeConfirm(){setConfirm(null);}
  const [syncStatus,setSyncStatus]=useState('idle'); // idle | syncing | synced | error

  // Check scheduled backup on mount AND every hour while app is open

  }
  function doBackup(){
    downloadBackup(assets,employees,history,types,'manual');
    const st=getStorageStats(assets,employees,history,types);
    logBackup('manual',st);
    setBackupLog(getBackupHistory());
    onBackup&&onBackup();
  }

  return React.createElement('div',{style:{padding:'24px',maxWidth:800}},
    // Storage card
    React.createElement('div',{className:'card',style:{marginBottom:20}},
      React.createElement('h3',{style:{marginBottom:16,fontSize:16}},'☁ Firebase Firestore Storage'),
      React.createElement('div',{style:{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(150px,1fr))',gap:12,marginBottom:20}},
        ...[
          {label:'Used',value:stats.kb.toFixed(1)+' KB',sub:stats.mb.toFixed(3)+' MB',color:'var(--primary)'},
          {label:'Available',value:(stats.remainMB).toFixed(0)+' MB',sub:'of 1,024 MB free',color:'var(--success)'},
          {label:'Usage',value:stats.pct.toFixed(4)+'%',sub:'of 1 GB limit',color:barColor},
          {label:'Assets',value:stats.assets,sub:'records stored',color:'var(--accent)'},
          {label:'Employees',value:stats.employees,sub:'records stored',color:'var(--accent)'},
          {label:'History',value:stats.history,sub:'log entries',color:'var(--muted)'},
        ].map(c=>React.createElement('div',{key:c.label,style:{background:'var(--surface2)',borderRadius:10,padding:'12px 14px'}},
          React.createElement('div',{style:{fontSize:11,color:'var(--muted)',marginBottom:4}},c.label),
          React.createElement('div',{style:{fontSize:20,fontWeight:700,color:c.color}},c.value),
          React.createElement('div',{style:{fontSize:10,color:'var(--muted)'}},c.sub)
        ))
      ),
      // Progress bar
      React.createElement('div',{style:{marginBottom:8,fontSize:11,color:'var(--muted)'}},
        'Storage usage: '+stats.kb.toFixed(1)+' KB used of 1,048,576 KB (1 GB)'),
      React.createElement('div',{style:{height:10,background:'var(--surface2)',borderRadius:5,overflow:'hidden'}},
        React.createElement('div',{style:{height:'100%',width:Math.max(stats.pct,0.1)+'%',background:barColor,borderRadius:5,transition:'width .5s'}})
      ),
      React.createElement('div',{style:{fontSize:10,color:'var(--muted)',marginTop:6}},
        '⚡ Firebase Spark (Free): 1 GB storage · 50,000 reads/day · 20,000 writes/day')
    ),

    // Manual backup card
    React.createElement('div',{className:'card',style:{marginBottom:20}},
      React.createElement('h3',{style:{marginBottom:12,fontSize:16}},'📦 Manual Backup'),
      React.createElement('p',{style:{color:'var(--muted)',fontSize:12,marginBottom:16}},
        'Downloads a complete JSON backup of all assets, employees, and history. Use this to keep offline copies.'),
      React.createElement('button',{className:'btn btn-primary',onClick:doBackup,style:{marginRight:8}},'⬇ Download Backup Now'),
      React.createElement('span',{style:{fontSize:11,color:'var(--muted)'}},
        backupLog.length ? ('Last manual backup: '+new Date(backupLog.filter(b=>b.label==='manual').slice(-1)[0]?.date||0).toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'})) : 'No manual backups yet')
    ),

    // Scheduled backup card
    React.createElement('div',{className:'card',style:{marginBottom:20}},
      React.createElement('div',{style:{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:12}},
        React.createElement('h3',{style:{fontSize:16,margin:0}},'⏰ Scheduled Auto-Backup'),
        React.createElement('div',{
          onClick:toggleSchedule,
          style:{width:44,height:24,borderRadius:12,background:schedule.enabled?'var(--success)':'var(--surface2)',cursor:'pointer',position:'relative',transition:'background .2s',border:'1px solid var(--border)'}},
          React.createElement('div',{style:{position:'absolute',top:2,left:schedule.enabled?20:2,width:18,height:18,borderRadius:'50%',background:'white',transition:'left .2s'}})
        )
      ),
      React.createElement('div',{style:{background:'var(--surface2)',borderRadius:8,padding:'10px 14px',marginBottom:12}},
        React.createElement('div',{style:{fontSize:12,fontWeight:600,marginBottom:4,color:schedule.enabled?'var(--success)':'var(--warn)'}},
          schedule.enabled ? '✅ Auto-backup is ON' : '⚠ Auto-backup is OFF'),
        React.createElement('div',{style:{fontSize:11,color:'var(--muted)',lineHeight:1.7}},
          '📍 Where: File downloads to your browser\'s Downloads folder automatically.',
          React.createElement('br'),
          '⏱ When: Checked every time you open the app + every hour while the tab is open.',
          React.createElement('br'),
          schedule.enabled && !schedule.lastBackup ? '🔔 First backup will run the next time you open the app.' :
          schedule.enabled && getDaysUntilNextBackup()!==null && getDaysUntilNextBackup()<=0 ? '🔴 Backup is overdue — click "Backup Now" above!' :
          schedule.enabled && getDaysUntilNextBackup()!==null ? '🟢 Next backup in ~'+Math.ceil(getDaysUntilNextBackup())+' day(s).' :
          '💡 Enable auto-backup to protect your data.'
        )
      ),
      React.createElement('div',{style:{display:'flex',gap:8,flexWrap:'wrap',marginBottom:12}},
        ['daily','weekly','monthly'].map(f=>React.createElement('button',{
          key:f,
          onClick:()=>handleScheduleChange(f),
          className:'btn '+(schedule.frequency===f?'btn-primary':'btn-secondary'),
          style:{fontSize:11,textTransform:'capitalize'}
        },f.charAt(0).toUpperCase()+f.slice(1)))
      ),
      schedule.lastBackup&&React.createElement('div',{style:{fontSize:11,color:'var(--muted)'}},
        'Last auto-backup: '+new Date(schedule.lastBackup).toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'})),
      !schedule.lastBackup&&schedule.enabled&&React.createElement('div',{style:{fontSize:11,color:'var(--warn)'}},
        '⏳ First backup will download when you next open the app.')
    ),

    // Backup log
    backupLog.length>0&&React.createElement('div',{className:'card'},
      React.createElement('h3',{style:{marginBottom:12,fontSize:16}},'📋 Backup History'),
      React.createElement('div',{style:{maxHeight:240,overflowY:'auto'}},
        React.createElement('table',{className:'data-table',style:{width:'100%'}},
          React.createElement('thead',null,React.createElement('tr',null,
            ['Date & Time','Type','Assets','Employees','History','Size'].map(h=>React.createElement('th',{key:h},h))
          )),
          React.createElement('tbody',null,
            [...backupLog].reverse().map((b,i)=>React.createElement('tr',{key:i},
              React.createElement('td',null,new Date(b.date).toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'})),
              React.createElement('td',null,React.createElement('span',{className:'badge '+(b.label.startsWith('auto')?'badge-blue':'badge-muted')},b.label)),
              React.createElement('td',null,b.assets||'—'),
              React.createElement('td',null,b.employees||'—'),
              React.createElement('td',null,b.history||'—'),
              React.createElement('td',null,b.kb?b.kb.toFixed(1)+' KB':'—')
            ))
          )
        )
      )
    )
  );
}
// ---- END STORAGE VIEW ----

ReactDOM.render(React.createElement(Root),document.getElementById('root'));
</script>
</body>
</html>
