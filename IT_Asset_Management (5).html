<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>IT Asset Management System</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',system-ui,sans-serif;background:#0f1117;color:#e2e8f0;min-height:100vh;font-size:14px}
  :root{
    --bg:#0f1117;--surface:#1a1d27;--surface2:#232636;--border:#2e3348;
    --accent:#4f8ef7;--accent2:#7c3aed;--success:#10b981;--warn:#f59e0b;--danger:#ef4444;
    --text:#e2e8f0;--muted:#8892a4;--card:#1e2130
  }
  .app{display:flex;height:100vh;overflow:hidden}
  .sidebar{width:220px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0}
  .logo{padding:20px 16px 16px;border-bottom:1px solid var(--border)}
  .logo-icon{width:32px;height:32px;background:linear-gradient(135deg,#4f8ef7,#7c3aed);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px;margin-bottom:8px}
  .logo-company{font-size:10px;font-weight:700;color:#a78bfa;letter-spacing:1.5px;margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--border)}
  .logo h1{font-size:13px;font-weight:700;color:#fff;letter-spacing:.5px}
  .logo p{font-size:11px;color:var(--muted);margin-top:2px}
  .nav{flex:1;padding:12px 8px;overflow-y:auto}
  .nav-section{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:1px;padding:8px 8px 4px}
  .nav-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;cursor:pointer;color:var(--muted);font-size:13px;margin-bottom:2px;transition:all .15s}
  .nav-item:hover{background:var(--surface2);color:var(--text)}
  .nav-item.active{background:rgba(79,142,247,.15);color:var(--accent)}
  .nav-item .icon{width:16px;text-align:center;font-size:14px}
  .role-badge{margin:12px 8px;padding:8px 10px;background:rgba(124,58,237,.1);border:1px solid rgba(124,58,237,.3);border-radius:8px;font-size:11px;color:#a78bfa}
  .main{flex:1;overflow:hidden;display:flex;flex-direction:column}
  .topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:12px 24px;display:flex;align-items:center;gap:16px}
  .topbar h2{font-size:16px;font-weight:600;color:#fff;flex:1}
  .topbar-actions{display:flex;gap:8px}
  .btn{padding:7px 14px;border-radius:8px;border:none;cursor:pointer;font-size:12px;font-weight:500;transition:all .15s;display:inline-flex;align-items:center;gap:6px}
  .btn-primary{background:var(--accent);color:#fff}
  .btn-primary:hover{background:#3b7de8}
  .btn-secondary{background:var(--surface2);color:var(--text);border:1px solid var(--border)}
  .btn-secondary:hover{background:var(--border)}
  .btn-danger{background:rgba(239,68,68,.15);color:var(--danger);border:1px solid rgba(239,68,68,.3)}
  .btn-danger:hover{background:rgba(239,68,68,.25)}
  .btn-sm{padding:4px 10px;font-size:11px}
  .btn-success{background:rgba(16,185,129,.15);color:var(--success);border:1px solid rgba(16,185,129,.3)}
  .content{flex:1;overflow-y:auto;padding:24px}
  .stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px}
  .stat-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px 20px}
  .stat-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px}
  .stat-value{font-size:28px;font-weight:700;color:#fff}
  .stat-sub{font-size:11px;color:var(--muted);margin-top:4px}
  .stat-card.accent .stat-value{color:var(--accent)}
  .stat-card.success .stat-value{color:var(--success)}
  .stat-card.warn .stat-value{color:var(--warn)}
  .stat-card.danger .stat-value{color:var(--danger)}
  .section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
  .section-title{font-size:14px;font-weight:600;color:#fff}
  .table-wrap{background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden}
  table{width:100%;border-collapse:collapse}
  th{padding:10px 16px;text-align:left;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;background:var(--surface2);border-bottom:1px solid var(--border)}
  td{padding:11px 16px;font-size:13px;color:var(--text);border-bottom:1px solid rgba(46,51,72,.5)}
  tr:last-child td{border-bottom:none}
  tr:hover td{background:rgba(255,255,255,.02)}
  .badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:500}
  .badge-success{background:rgba(16,185,129,.15);color:#34d399}
  .badge-warn{background:rgba(245,158,11,.15);color:#fbbf24}
  .badge-danger{background:rgba(239,68,68,.15);color:#f87171}
  .badge-muted{background:rgba(136,146,164,.15);color:var(--muted)}
  .badge-blue{background:rgba(79,142,247,.15);color:#7db4fa}
  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px}
  .modal{background:var(--surface);border:1px solid var(--border);border-radius:14px;width:100%;max-width:520px;max-height:90vh;overflow-y:auto}
  .modal-header{padding:20px 24px 0;display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
  .modal-header h3{font-size:16px;font-weight:600;color:#fff}
  .modal-close{width:28px;height:28px;border-radius:6px;background:var(--surface2);border:1px solid var(--border);cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:16px}
  .modal-close:hover{color:#fff}
  .modal-body{padding:0 24px}
  .modal-footer{padding:20px 24px;display:flex;gap:8px;justify-content:flex-end;border-top:1px solid var(--border);margin-top:20px}
  .form-group{margin-bottom:16px}
  .form-label{font-size:12px;font-weight:500;color:var(--muted);margin-bottom:6px;display:block}
  .form-input,.form-select{width:100%;padding:8px 12px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:13px;outline:none}
  .form-input:focus,.form-select:focus{border-color:var(--accent)}
  .form-select option{background:var(--surface)}
  .form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .search-bar{flex:1;max-width:280px;position:relative}
  .search-bar input{width:100%;padding:7px 12px 7px 32px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:12px;outline:none}
  .search-bar input:focus{border-color:var(--accent)}
  .search-icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:12px}
  .filter-bar{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;align-items:center}
  .filter-chip{padding:4px 10px;border-radius:99px;font-size:11px;cursor:pointer;border:1px solid var(--border);background:var(--surface2);color:var(--muted);transition:all .15s}
  .filter-chip.active{background:rgba(79,142,247,.2);color:var(--accent);border-color:rgba(79,142,247,.4)}
  .history-list{list-style:none}
  .history-item{padding:10px 0;border-bottom:1px solid rgba(46,51,72,.5);display:flex;gap:12px;align-items:flex-start}
  .history-item:last-child{border-bottom:none}
  .history-dot{width:8px;height:8px;border-radius:50%;background:var(--accent);margin-top:5px;flex-shrink:0}
  .history-dot.unassign{background:var(--muted)}
  .history-info{flex:1}
  .history-info strong{font-size:13px;color:#fff}
  .history-info small{font-size:11px;color:var(--muted);display:block;margin-top:2px}
  .empty-state{text-align:center;padding:48px 24px;color:var(--muted)}
  .empty-icon{font-size:36px;margin-bottom:12px;opacity:.5}
  .dash-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:24px}
  .type-breakdown{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px}
  .type-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
  .type-bar-bg{flex:1;height:6px;background:var(--surface2);border-radius:99px;overflow:hidden}
  .type-bar{height:100%;border-radius:99px;background:var(--accent)}
  .type-label{font-size:12px;color:var(--text);min-width:80px}
  .type-count{font-size:12px;color:var(--muted);min-width:20px;text-align:right}
  .detail-section{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:16px}
  .detail-section h4{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:12px}
  .detail-row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid rgba(46,51,72,.3);font-size:13px}
  .detail-row:last-child{border-bottom:none}
  .detail-key{color:var(--muted)}
  .detail-val{color:#fff;font-weight:500}
  .notification{position:fixed;bottom:20px;right:20px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px 16px;display:flex;align-items:center;gap:10px;font-size:13px;z-index:200;animation:slideIn .25s ease;max-width:300px}
  .notification.success{border-color:rgba(16,185,129,.4);background:rgba(16,185,129,.1)}
  .notification.error{border-color:rgba(239,68,68,.4);background:rgba(239,68,68,.1)}
  @keyframes slideIn{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
  .assign-user-card{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:10px 12px;display:flex;align-items:center;gap:10px;margin-bottom:8px;cursor:pointer;transition:all .15s}
  .assign-user-card:hover,.assign-user-card.selected{border-color:var(--accent);background:rgba(79,142,247,.1)}
  .avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#4f8ef7,#7c3aed);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;flex-shrink:0}
  .avatar-sm{width:24px;height:24px;font-size:10px}
  .chip{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:99px;font-size:11px;background:var(--surface2);border:1px solid var(--border);color:var(--muted)}
  .login-screen{min-height:100vh;background:#0f1117;display:flex;align-items:center;justify-content:center}
  .login-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:40px;width:100%;max-width:380px}
  .login-logo{display:flex;align-items:center;gap:12px;margin-bottom:28px}
  .login-logo-icon{width:42px;height:42px;background:linear-gradient(135deg,#4f8ef7,#7c3aed);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px}
  .login-logo-text h1{font-size:18px;font-weight:700;color:#fff}
  .login-logo-text p{font-size:11px;color:var(--muted);margin-top:2px}
  .login-company{font-size:11px;font-weight:700;color:#a78bfa;letter-spacing:1px;margin-bottom:4px}
  .login-title{font-size:22px;font-weight:700;color:#fff;margin-bottom:6px}
  .login-sub{font-size:13px;color:var(--muted);margin-bottom:28px}
  .login-error{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);border-radius:8px;padding:10px 14px;font-size:12px;color:#f87171;margin-bottom:16px}
  .login-users{margin-top:20px;padding-top:20px;border-top:1px solid var(--border)}
  .login-users-title{font-size:11px;color:var(--muted);margin-bottom:10px}
  .login-user-row{display:flex;justify-content:space-between;font-size:12px;padding:4px 0;color:var(--muted)}
  .login-user-row span{color:var(--text)}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script>
const{useState,useEffect,useMemo}=React;
const DEFAULT_ASSET_TYPES=['Laptop','Monitor','Mouse','Keyboard','Headset','Webcam','Docking Station','Printer','Other'];
const DEPARTMENTS=['Engineering','Finance','HR','Marketing','Operations','Sales','IT','Design'];
function genId(prefix){return prefix+'-'+Math.random().toString(36).substr(2,6).toUpperCase()}
function today(){return new Date().toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'})}
function initials(name){return name.split(' ').map(w=>w[0]).join('').substring(0,2).toUpperCase()}
const INIT_EMPLOYEES=[
  {id:'EMP-001',name:'Riya Sharma',department:'Engineering',email:'riya.sharma@company.com',joinDate:'Jan 2023'},
  {id:'EMP-002',name:'Arjun Mehta',department:'Sales',email:'arjun.mehta@company.com',joinDate:'Mar 2022'},
  {id:'EMP-003',name:'Priya Nair',department:'Design',email:'priya.nair@company.com',joinDate:'Jul 2023'},
  {id:'EMP-004',name:'Vikram Singh',department:'Finance',email:'vikram.singh@company.com',joinDate:'Nov 2021'},
  {id:'EMP-005',name:'Anika Patel',department:'Marketing',email:'anika.patel@company.com',joinDate:'Apr 2024'},
];
const INIT_ASSETS=[
  {id:'AST-A1B2C3',type:'Laptop',brand:'Dell',model:'XPS 15',serial:'DL-9876543',status:'Assigned',condition:'Good',assignedTo:'EMP-001',purchaseDate:'Jan 2023'},
  {id:'AST-D4E5F6',type:'Monitor',brand:'LG',model:'27UL600',serial:'LG-1234567',status:'Assigned',condition:'Good',assignedTo:'EMP-001',purchaseDate:'Feb 2023'},
  {id:'AST-G7H8I9',type:'Laptop',brand:'Apple',model:'MacBook Pro M3',serial:'AP-5558821',status:'Assigned',condition:'Excellent',assignedTo:'EMP-003',purchaseDate:'Sep 2023'},
  {id:'AST-J1K2L3',type:'Mouse',brand:'Logitech',model:'MX Master 3',serial:'LG-4445556',status:'Available',condition:'Good',assignedTo:null,purchaseDate:'Jun 2023'},
  {id:'AST-M4N5O6',type:'Keyboard',brand:'Logitech',model:'MX Keys',serial:'LG-7778889',status:'Available',condition:'Good',assignedTo:null,purchaseDate:'Jun 2023'},
  {id:'AST-P7Q8R9',type:'Laptop',brand:'Lenovo',model:'ThinkPad X1',serial:'LN-3331112',status:'Maintenance',condition:'Fair',assignedTo:null,purchaseDate:'May 2022'},
  {id:'AST-S1T2U3',type:'Headset',brand:'Bose',model:'QC45',serial:'BS-9990001',status:'Assigned',condition:'Excellent',assignedTo:'EMP-002',purchaseDate:'Dec 2023'},
  {id:'AST-V4W5X6',type:'Monitor',brand:'Samsung',model:'27" Curved',serial:'SM-2223334',status:'Available',condition:'Good',assignedTo:null,purchaseDate:'Mar 2023'},
  {id:'AST-Y7Z8A9',type:'Webcam',brand:'Logitech',model:'C920',serial:'LG-6667778',status:'Assigned',condition:'Good',assignedTo:'EMP-004',purchaseDate:'Aug 2023'},
  {id:'AST-B1C2D3',type:'Docking Station',brand:'Dell',model:'WD19 TB',serial:'DL-1112223',status:'Available',condition:'Good',assignedTo:null,purchaseDate:'Oct 2022'},
];
const INIT_HISTORY=[
  {id:'HIS-1',assetId:'AST-A1B2C3',action:'Assigned',employeeId:'EMP-001',note:'Initial assignment',date:'15 Jan 2023',by:'IT Admin'},
  {id:'HIS-2',assetId:'AST-D4E5F6',action:'Assigned',employeeId:'EMP-001',note:'New joiner setup',date:'16 Feb 2023',by:'IT Admin'},
  {id:'HIS-3',assetId:'AST-G7H8I9',action:'Assigned',employeeId:'EMP-003',note:'Designer workstation',date:'10 Sep 2023',by:'IT Admin'},
  {id:'HIS-4',assetId:'AST-P7Q8R9',action:'Unassigned',employeeId:'EMP-002',note:'Sent for repair',date:'01 Apr 2024',by:'IT Admin'},
  {id:'HIS-5',assetId:'AST-S1T2U3',action:'Assigned',employeeId:'EMP-002',note:'Remote work setup',date:'05 Dec 2023',by:'IT Admin'},
];
function App({initialRole,onLogout}){
  const[view,setView]=useState('dashboard');
  const[assets,setAssets]=useState(INIT_ASSETS);
  const[employees,setEmployees]=useState(INIT_EMPLOYEES);
  const[history,setHistory]=useState(INIT_HISTORY);
  const[modal,setModal]=useState(null);
  const[notification,setNotification]=useState(null);
  const[currentRole,setCurrentRole]=useState(initialRole||'admin');
  const[adminUnlocked,setAdminUnlocked]=useState(false);
  const[showPinModal,setShowPinModal]=useState(false);
  const[pinInput,setPinInput]=useState('');
  const[pinError,setPinError]=useState('');
  const[assetTypes,setAssetTypes]=useState(DEFAULT_ASSET_TYPES);
  const ADMIN_PIN='admin123';
  function requireAdmin(fn){
    if(adminUnlocked){fn();}
    else{setShowPinModal(true);setPinInput('');setPinError('');}
  }
  function handlePinSubmit(){
    if(pinInput===ADMIN_PIN){setAdminUnlocked(true);setShowPinModal(false);setPinError('');}
    else{setPinError('Incorrect PIN. Try again.');}
  }
  const[assetFilter,setAssetFilter]=useState('All');
  const[assetSearch,setAssetSearch]=useState('');
  const[empSearch,setEmpSearch]=useState('');
  useEffect(()=>{if(notification){const t=setTimeout(()=>setNotification(null),3000);return()=>clearTimeout(t)}},[notification]);
  function notify(msg,type='success'){setNotification({msg,type})}
  function addHistory(assetId,action,employeeId,note){
    setHistory(h=>[{id:'HIS-'+Date.now(),assetId,action,employeeId,note,date:today(),by:currentRole==='admin'?'IT Admin':'IT Team'},...h]);
  }
  function saveAsset(data,editId){
    if(editId){setAssets(a=>a.map(x=>x.id===editId?{...x,...data}:x));notify('Asset updated');}
    else{const n={...data,id:genId('AST'),status:'Available',assignedTo:null};setAssets(a=>[n,...a]);addHistory(n.id,'Added',null,'Asset registered');notify('Asset added');}
    setModal(null);
  }
  function removeAsset(id){
    if(assets.find(x=>x.id===id).status==='Assigned'){notify('Unassign asset before removing','error');return;}
    setAssets(as=>as.filter(x=>x.id!==id));notify('Asset removed');
  }
  function saveEmployee(data,editId){
    if(editId){setEmployees(e=>e.map(x=>x.id===editId?{...x,...data}:x));notify('Employee updated');}
    else{setEmployees(e=>[{...data,id:genId('EMP'),joinDate:today()},...e]);notify('Employee added');}
    setModal(null);
  }
  function removeEmployee(id){
    if(assets.some(a=>a.assignedTo===id)){notify('Unassign all assets first','error');return;}
    setEmployees(e=>e.filter(x=>x.id!==id));notify('Employee removed');
  }
  function assignAsset(assetId,employeeId,note){
    setAssets(a=>a.map(x=>x.id===assetId?{...x,status:'Assigned',assignedTo:employeeId}:x));
    addHistory(assetId,'Assigned',employeeId,note||'Assigned to employee');
    notify('Asset assigned');setModal(null);
  }
  function unassignAsset(assetId){
    const a=assets.find(x=>x.id===assetId);
    if(!a||!a.assignedTo)return;
    setAssets(as=>as.map(x=>x.id===assetId?{...x,status:'Available',assignedTo:null}:x));
    addHistory(assetId,'Unassigned',a.assignedTo,'Asset returned');
    notify('Asset unassigned');setModal(null);
  }
  const stats={total:assets.length,assigned:assets.filter(a=>a.status==='Assigned').length,available:assets.filter(a=>a.status==='Available').length,maintenance:assets.filter(a=>a.status==='Maintenance').length};
  const filteredAssets=useMemo(()=>assets.filter(a=>{
    const mf=assetFilter==='All'||a.status===assetFilter||a.type===assetFilter;
    const s=assetSearch.toLowerCase();
    const ms=!s||a.id.toLowerCase().includes(s)||a.brand.toLowerCase().includes(s)||a.type.toLowerCase().includes(s)||a.serial.toLowerCase().includes(s)||(a.model||'').toLowerCase().includes(s);
    return mf&&ms;
  }),[assets,assetFilter,assetSearch]);
  const filteredEmps=useMemo(()=>{const s=empSearch.toLowerCase();return employees.filter(e=>!s||e.name.toLowerCase().includes(s)||e.id.toLowerCase().includes(s)||e.department.toLowerCase().includes(s));},[employees,empSearch]);
  const getEmployee=id=>employees.find(e=>e.id===id);
  const getAsset=id=>assets.find(a=>a.id===id);
  const getEmployeeAssets=id=>assets.filter(a=>a.assignedTo===id);
  const statusColor=s=>s==='Assigned'?'badge-success':s==='Available'?'badge-blue':s==='Maintenance'?'badge-warn':'badge-muted';
  const viewTitles={dashboard:'Dashboard',assets:'Asset Inventory',employees:'Employees',assignments:'Assignments',history:'Asset History',types:'Type Manager'};
  return React.createElement(React.Fragment,null,
    React.createElement('div',{className:'app'},
      React.createElement('div',{className:'sidebar'},
        React.createElement('div',{className:'logo'},
          React.createElement('div',{className:'logo-company'},'Label UP'),
          React.createElement('div',{className:'logo-icon'},'⬡'),
          React.createElement('h1',null,'ITAM'),
          React.createElement('p',null,'Asset Management')
        ),
        React.createElement('div',{className:'nav'},
          React.createElement('div',{className:'nav-section'},'Navigation'),
          [['dashboard','▦','Dashboard'],['assets','⬡','Asset Inventory'],['employees','◎','Employees'],['assignments','⇄','Assignments'],['history','◷','History'],['types','⊞','Type Manager']].map(([id,icon,label])=>
            React.createElement('div',{key:id,className:`nav-item${view===id?' active':''}`,onClick:()=>setView(id)},
              React.createElement('span',{className:'icon'},icon),label
            )
          ),
          React.createElement('div',{className:'nav-section',style:{marginTop:16}},'Access'),
          React.createElement('div',{className:'role-badge',style:{cursor:'pointer'},onClick:()=>{if(adminUnlocked){setAdminUnlocked(false);notify('Admin access locked');}else{setShowPinModal(true);setPinInput('');setPinError('');}}},
            React.createElement('div',{style:{fontSize:12,marginBottom:4}},adminUnlocked?'🔓 Admin Unlocked':'🔒 View Only'),
            React.createElement('div',{style:{fontSize:10,color:'var(--muted)'}},adminUnlocked?'Click to lock':'Click to unlock edit access')
          )
        )
      ),
